services:
  postgres:
    image: postgres:16
    container_name: jium-postgres
    environment:
      POSTGRES_USER: jium
      POSTGRES_PASSWORD: jium_dev_password
      POSTGRES_DB: jium_user_context
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jium -d jium_user_context"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
