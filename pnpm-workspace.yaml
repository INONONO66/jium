packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "vendor/ggui/*"

overrides:
  '@ggui-ai/ui-gen': workspace:*

verifyDepsBeforeRun: false
strictDepBuilds: false
autoInstallPeers: true
minimumReleaseAgeExclude:
  - '@ggui-ai/*'
allowBuilds:
  '@google/genai': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  sqlite3: false
patchedDependencies:
  '@ggui-ai/mcp-server-handlers@0.2.0-alpha.4': patches/@ggui-ai__mcp-server-handlers@0.2.0-alpha.4.patch
