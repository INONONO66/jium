packages:
  - "apps/*"
  - "services/*"
  - "packages/*"
  - "vendor/ggui/*"

overrides:
  '@ggui-ai/ui-gen': workspace:*

verifyDepsBeforeRun: false
strictDepBuilds: false
autoInstallPeers: true
minimumReleaseAgeExclude:
  - '@ggui-ai/*'
allowBuilds:
  '@google/genai': true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
